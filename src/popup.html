<!DOCTYPE html>
<html>
<head>
  <title>Sensitive Info Scanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      width: 300px;
    }
    #results {
      white-space: pre-wrap;
      background-color: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .copy-btn {
      margin-left: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>Scan Results</h3>
  <div id="results">Scanning...</div>

  <script src="popup.js"></script>
</body>
</html>
